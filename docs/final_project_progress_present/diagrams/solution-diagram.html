document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\" font-weight=\"600\" font-family=\"ui-monospace, Menlo, Consolas, monospace\">PTX<\u002Ftext>\n          <\u002Fg>\n          <line id=\"r2-a2\" x1=\"842\" y1=\"480\" x2=\"970\" y2=\"480\" stroke=\"#4a5568\" stroke-width=\"2.5\" marker-end=\"url(#arrow-gray)\"><\u002Fline>\n\n          <!-- our toolchain tool box (pulseable) -->\n          <g id=\"r2-b3\">\n            <rect id=\"r2-b3-rect\" x=\"970\" y=\"425\" width=\"420\" height=\"110\" rx=\"10\" fill=\"var(--tool-fill)\" stroke=\"var(--tool-stroke)\" stroke-width=\"2\"><\u002Frect>\n            <text x=\"1180\" y=\"466\" text-anchor=\"middle\" font-size=\"22\" fill=\"var(--tool-text)\" font-style=\"italic\" font-weight=\"600\">our toolchain<\u002Ftext>\n            <text x=\"1180\" y=\"500\" text-anchor=\"middle\" font-size=\"14\" fill=\"#4a5568\" font-family=\"ui-monospace, Menlo, Consolas, monospace\">ptx_translator.py + assembler.py<\u002Ftext>\n            <!-- pulse ring overlay -->\n            <rect id=\"r2-b3-pulse\" x=\"970\" y=\"425\" width=\"420\" height=\"110\" rx=\"10\" fill=\"none\" stroke=\"var(--tool-stroke)\" stroke-width=\"3\" opacity=\"0\"><\u002Frect>\n          <\u002Fg>\n          <line id=\"r2-a3\" x1=\"1392\" y1=\"480\" x2=\"1520\" y2=\"480\" stroke=\"#4a5568\" stroke-width=\"2.5\" marker-end=\"url(#arrow-gray)\"><\u002Fline>\n\n          <!-- program.hex data -->\n          <g id=\"r2-b4\">\n            <rect x=\"1520\" y=\"425\" width=\"260\" height=\"110\" rx=\"10\" fill=\"var(--data-fill)\" stroke=\"var(--data-stroke)\" stroke-width=\"2\"><\u002Frect>\n            <text x=\"1650\" y=\"488\" text-anchor=\"middle\" font-size=\"22\" fill=\"var(--data-text)\" font-weight=\"600\" font-family=\"ui-monospace, Menlo, Consolas, monospace\">program.hex<\u002Ftext>\n          <\u002Fg>\n        <\u002Fg>\n\n        <!-- =================== ROW 3: RUN =================== -->\n        <!-- SoC container always visible (from Stage 1) -->\n        <g id=\"soc\">\n          <rect x=\"360\" y=\"620\" width=\"1320\" height=\"300\" rx=\"16\" fill=\"var(--soc-fill)\" stroke=\"var(--soc-stroke)\" stroke-width=\"4\"><\u002Frect>\n          <text x=\"390\" y=\"656\" font-size=\"20\" font-weight=\"700\" fill=\"var(--soc-stroke)\">\n            Network Processor SoC — one FPGA\n          <\u002Ftext>\n        <\u002Fg>\n\n        <g id=\"row3\" class=\"fade\">\n          <!-- Packet In arrow + label (outside SoC, left) -->\n          <g id=\"r3-in\">\n            <text x=\"220\" y=\"770\" font-size=\"18\" fill=\"#2d3748\" text-anchor=\"middle\">Packet In<\u002Ftext>\n            <line x1=\"220\" y1=\"784\" x2=\"358\" y2=\"784\" stroke=\"#4a5568\" stroke-width=\"3\" marker-end=\"url(#arrow-gray)\"><\u002Fline>\n          <\u002Fg>\n\n          <!-- ARM CPU (top inside SoC) -->\n          <g id=\"r3-arm\">\n            <rect x=\"780\" y=\"655\" width=\"260\" height=\"80\" rx=\"10\" fill=\"var(--arm-fill)\" stroke=\"var(--arm-stroke)\" stroke-width=\"2.5\"><\u002Frect>\n            <text x=\"910\" y=\"702\" text-anchor=\"middle\" font-size=\"22\" fill=\"var(--arm-stroke)\" font-weight=\"600\">ARM CPU<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Convertible FIFO (center) -->\n          <g id=\"r3-fifo\">\n            <rect x=\"720\" y=\"770\" width=\"380\" height=\"110\" rx=\"10\" fill=\"var(--fifo-fill)\" stroke=\"var(--fifo-stroke)\" stroke-width=\"2.5\"><\u002Frect>\n            <text x=\"910\" y=\"812\" text-anchor=\"middle\" font-size=\"22\" fill=\"var(--fifo-stroke)\" font-weight=\"600\">Convertible FIFO<\u002Ftext>\n            <text x=\"910\" y=\"842\" text-anchor=\"middle\" font-size=\"15\" fill=\"#2f855a\">packet buffer<\u002Ftext>\n          <\u002Fg>\n\n          <!-- arrow FIFO <-> ARM with label \"header\" -->\n          <g id=\"r3-arrArm\">\n            <line x1=\"910\" y1=\"770\" x2=\"910\" y2=\"735\" stroke=\"#4a5568\" stroke-width=\"2.5\" marker-end=\"url(#arrow-gray)\" marker-start=\"url(#arrow-gray)\"><\u002Fline>\n            <text x=\"928\" y=\"758\" font-size=\"15\" fill=\"#4a5568\" font-style=\"italic\">header<\u002Ftext>\n          <\u002Fg>\n\n          <!-- GPU (right inside SoC) -->\n          <g id=\"r3-gpu\">\n            <rect id=\"r3-gpu-rect\" x=\"1240\" y=\"735\" width=\"320\" height=\"130\" rx=\"10\" fill=\"var(--gpu-fill)\" stroke=\"var(--gpu-stroke)\" stroke-width=\"2.5\"><\u002Frect>\n            <text x=\"1400\" y=\"790\" text-anchor=\"middle\" font-size=\"24\" fill=\"var(--gpu-stroke)\" font-weight=\"700\">GPU<\u002Ftext>\n            <text x=\"1400\" y=\"822\" text-anchor=\"middle\" font-size=\"15\" fill=\"#c05621\" font-style=\"italic\">BCAST ISA<\u002Ftext>\n          <\u002Fg>\n\n          <!-- arrow FIFO <-> GPU with label \"features via DMA\" -->\n          <g id=\"r3-arrGpu\">\n            <line x1=\"1100\" y1=\"825\" x2=\"1240\" y2=\"800\" stroke=\"#4a5568\" stroke-width=\"2.5\" marker-end=\"url(#arrow-gray)\" marker-start=\"url(#arrow-gray)\"><\u002Fline>\n            <text x=\"1170\" y=\"800\" font-size=\"14\" fill=\"#4a5568\" font-style=\"italic\" text-anchor=\"middle\">features via DMA<\u002Ftext>\n          <\u002Fg>\n\n          <!-- Packet Out arrow (outside SoC, right) -->\n          <g id=\"r3-out\">\n            <line x1=\"1682\" y1=\"825\" x2=\"1820\" y2=\"825\" stroke=\"#4a5568\" stroke-width=\"3\" marker-end=\"url(#arrow-gray)\"><\u002Fline>\n            <text x=\"1820\" y=\"810\" font-size=\"18\" fill=\"#2d3748\" text-anchor=\"end\">Packet Out<\u002Ftext>\n          <\u002Fg>\n\n          <!-- packet graphic (animated in Stage 4) -->\n          <g id=\"packet\" style=\"opacity:0\">\n            <rect x=\"-40\" y=\"772\" width=\"28\" height=\"24\" rx=\"4\" fill=\"#2b6cb0\"><\u002Frect>\n          <\u002Fg>\n        <\u002Fg>\n\n        <!-- =================== CROSS-ROW DASHED ARROWS (Stage 5) =================== -->\n        <g id=\"cross\" class=\"fade\">\n          <!-- weights (Row 1, ~x1320,y285-bottom) -> GPU (Row 3, ~x1400,y735-top) -->\n          <path id=\"cross1\" d=\"M 1320 285 C 1320 480, 1380 580, 1380 735\" fill=\"none\" stroke=\"var(--cross)\" stroke-width=\"3\" stroke-dasharray=\"10 7\" marker-end=\"url(#arrow-purple)\"><\u002Fpath>\n          <text x=\"1340\" y=\"470\" font-size=\"16\" fill=\"var(--cross)\" font-style=\"italic\">loaded to GPU DMEM<\u002Ftext>\n\n          <!-- program.hex (Row 2, ~x1650,y535) -> GPU (Row 3, ~x1460,y735) -->\n          <path id=\"cross2\" d=\"M 1650 535 C 1650 620, 1490 680, 1460 735\" fill=\"none\" stroke=\"var(--cross)\" stroke-width=\"3\" stroke-dasharray=\"10 7\" marker-end=\"url(#arrow-purple)\"><\u002Fpath>\n          <text x=\"1480\" y=\"670\" font-size=\"16\" fill=\"var(--cross)\" font-style=\"italic\">loaded to GPU IMEM<\u002Ftext>\n        <\u002Fg>\n\n      <\u002Fsvg>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n(function(){\n  // ---------- Scaling ----------\n  const stage = document.getElementById('stage');\n  function fit() {\n    const sx = window.innerWidth / 1920;\n    const sy = window.innerHeight / 1080;\n    const s = Math.min(sx, sy);\n    stage.style.transform = `scale(${s})`;\n  }\n  window.addEventListener('resize', fit);\n  fit();\n\n  // ---------- Stage controller ----------\n  const subtitleEl = document.getElementById('subtitle');\n  const counterEl = document.getElementById('counter');\n  const prevBtn = document.getElementById('prevBtn');\n  const nextBtn = document.getElementById('nextBtn');\n  const playBtn = document.getElementById('playBtn');\n\n  const SUBTITLES = [\n    \"Our solution has three parts — training, compilation, and runtime.\",\n    \"We train an 11-16-8-2 neural network on the NSL-KDD intrusion detection dataset.\",\n    \"We translate CUDA to our custom ISA through our own Python toolchain.\",\n    \"At inference, packets flow through our custom silicon — on-chip, no host round-trip.\",\n    \"Three phases, one pipeline. Every layer — training, compilation, and silicon — is ours.\"\n  ];\n\n  // Row 1 reveal order\n  const R1_SEQ = ['r1-b1','r1-a1','r1-b2','r1-a2','r1-b3'];\n  const R2_SEQ = ['r2-b1','r2-a1','r2-b2','r2-a2','r2-b3','r2-a3','r2-b4'];\n  const R3_SEQ = ['r3-fifo','r3-arm','r3-arrArm','r3-gpu','r3-arrGpu','r3-in','r3-out'];\n\n  function setOpacity(id, v) {\n    const el = document.getElementById(id);\n    if (el) el.style.opacity = v;\n  }\n  function showId(id, delay=0) {\n    setTimeout(() => {\n      const el = document.getElementById(id);\n      if (!el) return;\n      el.style.opacity = 1;\n      el.classList.remove('box-enter');\n      // Force reflow to retrigger animation\n      void el.getBoundingClientRect();\n      el.classList.add('box-enter');\n    }, delay);\n  }\n  function hideId(id) { setOpacity(id, 0); }\n\n  function hideGroup(ids) { ids.forEach(hideId); }\n\n  // Helper: set subtitle with fade\n  function setSubtitle(text) {\n    subtitleEl.style.opacity = 0;\n    setTimeout(() => {\n      subtitleEl.textContent = text;\n      subtitleEl.style.opacity = 1;\n    }, 150);\n  }\n\n  // Reset everything to baseline (Stage 1)\n  function resetAll() {\n    // Hide rows as groups (but we show individual ids granularly on stages)\n    ['row1','row2','row3','cross'].forEach(id => {\n      document.getElementById(id).classList.remove('show');\n    });\n    // Hide individual row children\n    [...R1_SEQ, ...R2_SEQ, ...R3_SEQ].forEach(hideId);\n    // Packet\n    const pkt = document.getElementById('packet');\n    pkt.style.opacity = 0;\n    pkt.style.transform = 'translateX(0px)';\n    // Pulse rings\n    const p = document.getElementById('r2-b3-pulse');\n    p.style.opacity = 0;\n    // Clear any running classes\n    document.querySelectorAll('.glow, .arrow-pulse, .pulse-ring').forEach(el => {\n      el.classList.remove('glow','arrow-pulse','pulse-ring');\n    });\n  }\n\n  function showAllRow1() {\n    document.getElementById('row1').classList.add('show');\n    R1_SEQ.forEach((id,i) => showId(id, i*120));\n  }\n  function showAllRow2(withPulse=false) {\n    document.getElementById('row2').classList.add('show');\n    R2_SEQ.forEach((id,i) => showId(id, i*120));\n    if (withPulse) {\n      setTimeout(() => {\n        const p = document.getElementById('r2-b3-pulse');\n        p.style.opacity = 1;\n        p.classList.remove('pulse-ring');\n        void p.getBoundingClientRect();\n        p.classList.add('pulse-ring');\n        // fade the ring out by css animation end; keep a subtle sustained pulse\n        setTimeout(() => { p.style.opacity = 0; }, 1100);\n      }, R2_SEQ.length*120 + 200);\n    }\n  }\n  function showAllRow3(withPacket=false) {\n    document.getElementById('row3').classList.add('show');\n    R3_SEQ.forEach((id,i) => showId(id, i*120));\n    if (withPacket) {\n      const startDelay = R3_SEQ.length*120 + 200;\n      setTimeout(() => {\n        const pkt = document.getElementById('packet');\n        pkt.style.transition = 'none';\n        pkt.style.transform = 'translateX(0px)';\n        pkt.style.opacity = 0;\n        // Start at x=-40 (off screen-ish at left of stage); travel to center of FIFO ~x=910\n        // packet graphic's base x is -40, so translate by ~940\n        void pkt.getBoundingClientRect();\n        pkt.style.transition = 'transform 1200ms ease-in-out, opacity 300ms ease';\n        pkt.style.opacity = 1;\n        requestAnimationFrame(() => {\n          pkt.style.transform = 'translateX(940px)';\n        });\n        // After packet arrives, pulse the two internal arrows once\n        setTimeout(() => {\n          ['r3-arrArm','r3-arrGpu'].forEach(id => {\n            const line = document.querySelector('#'+id+' line');\n            if (line) {\n              line.classList.remove('arrow-pulse');\n              void line.getBoundingClientRect();\n              line.classList.add('arrow-pulse');\n            }\n          });\n          // fade packet out\n          pkt.style.transition = 'opacity 400ms ease';\n          pkt.style.opacity = 0;\n        }, 1400);\n      }, startDelay);\n    }\n  }\n  function showCross() {\n    document.getElementById('cross').classList.add('show');\n  }\n  function glowAll() {\n    const s = document.getElementById('stage');\n    // apply glow to the svg content\n    const svg = document.getElementById('svg');\n    svg.classList.remove('glow');\n    void svg.getBoundingClientRect();\n    svg.classList.add('glow');\n  }\n\n  // ---------- Stages ----------\n  let currentStage = 1;\n  const TOTAL = 5;\n\n  function renderStage(n, animate=true) {\n    currentStage = n;\n    counterEl.textContent = `Stage ${n} of ${TOTAL}`;\n    setSubtitle(SUBTITLES[n-1]);\n    resetAll();\n\n    if (n >= 2) {\n      if (animate) showAllRow1();\n      else { document.getElementById('row1').classList.add('show'); R1_SEQ.forEach(id => setOpacity(id,1)); }\n    }\n    if (n >= 3) {\n      if (animate) showAllRow2(n === 3);\n      else { document.getElementById('row2').classList.add('show'); R2_SEQ.forEach(id => setOpacity(id,1)); }\n    }\n    if (n >= 4) {\n      if (animate) showAllRow3(n === 4);\n      else { document.getElementById('row3').classList.add('show'); R3_SEQ.forEach(id => setOpacity(id,1)); }\n    }\n    if (n >= 5) {\n      showCross();\n      setTimeout(glowAll, 700);\n    }\n\n    prevBtn.disabled = (n === 1);\n    nextBtn.disabled = (n === TOTAL);\n  }\n\n  // ---------- Nav ----------\n  function goNext() {\n    if (currentStage < TOTAL) renderStage(currentStage + 1);\n  }\n  function goPrev() {\n    if (currentStage > 1) renderStage(currentStage - 1);\n  }\n  prevBtn.addEventListener('click', () => { stopAutoplay(); goPrev(); });\n  nextBtn.addEventListener('click', () => { stopAutoplay(); goNext(); });\n\n  // ---------- Autoplay ----------\n  let playing = false;\n  let playTimer = null;\n  const AUTOPLAY_INTERVAL = 8000;\n\n  function startAutoplay() {\n    playing = true;\n    playBtn.classList.add('playing');\n    playBtn.textContent = '⏸ Pause';\n    // If at the end, rewind to start\n    if (currentStage === TOTAL) {\n      renderStage(1);\n    }\n    scheduleNext();\n  }\n  function scheduleNext() {\n    clearTimeout(playTimer);\n    playTimer = setTimeout(() => {\n      if (!playing) return;\n      if (currentStage < TOTAL) {\n        renderStage(currentStage + 1);\n        scheduleNext();\n      } else {\n        stopAutoplay();\n      }\n    }, AUTOPLAY_INTERVAL);\n  }\n  function stopAutoplay() {\n    playing = false;\n    playBtn.classList.remove('playing');\n    playBtn.textContent = '▶ Play';\n    clearTimeout(playTimer);\n  }\n  playBtn.addEventListener('click', () => {\n    if (playing) stopAutoplay(); else startAutoplay();\n  });\n\n  // ---------- Keyboard ----------\n  window.addEventListener('keydown', (e) => {\n    if (e.key === 'ArrowLeft')  { e.preventDefault(); stopAutoplay(); goPrev(); }\n    if (e.key === 'ArrowRight') { e.preventDefault(); stopAutoplay(); goNext(); }\n    if (e.code === 'Space')     { e.preventDefault(); if (playing) stopAutoplay(); else startAutoplay(); }\n  });\n\n  // ---------- Init ----------\n  renderStage(1, false);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
