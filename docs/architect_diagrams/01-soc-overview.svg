<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Brief Network Processor SoC Architecture</title>
  <desc id="desc">Eight NetFPGA ingress streams pass through the input arbiter, output-port lookup, Lab 8 wrapper, and output queues. The wrapper contains a convertible FIFO, ARM CPU, DMA engine, GPU, and control registers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/></marker>
    <marker id="ctrlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72509b"/></marker>
    <style>
      .bg{fill:#ffffff}.outer{fill:#f8fafc;stroke:#334e68;stroke-width:2.5}.group{fill:#ffffff;stroke:#627d98;stroke-width:2}.network{fill:#e8f1fb;stroke:#245b8a;stroke-width:2}.compute{fill:#e8f5e9;stroke:#367a42;stroke-width:2}.memory{fill:#fff3d6;stroke:#a76b00;stroke-width:2}.control{fill:#f1e9fb;stroke:#72509b;stroke-width:2}.title{font:700 34px 'Segoe UI',sans-serif;fill:#102a43}.subtitle{font:600 23px 'Segoe UI',sans-serif;fill:#243b53}.label{font:600 20px 'Segoe UI',sans-serif;fill:#102a43;text-anchor:middle}.small{font:16px 'Segoe UI',sans-serif;fill:#334e68;text-anchor:middle}.tiny{font:14px 'Segoe UI',sans-serif;fill:#486581;text-anchor:middle}.data{fill:none;stroke:#243447;stroke-width:3;marker-end:url(#arrow)}.bidir{fill:none;stroke:#243447;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.ctrl{fill:none;stroke:#72509b;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#ctrlArrow)}.lineLabel{font:600 15px 'Segoe UI',sans-serif;fill:#243447;text-anchor:middle}.legend{font:15px 'Segoe UI',sans-serif;fill:#334e68}
    </style>
  </defs>
  <rect class="bg" width="1800" height="1050"/>
  <text class="title" x="900" y="52" text-anchor="middle">Network Processor SoC — Brief Architecture</text>
  <text class="small" x="900" y="82">NetFPGA V2 custom datapath; all custom blocks share one clock</text>

  <rect class="network" x="25" y="330" width="210" height="160" rx="16"/>
  <text class="label" x="130" y="373">8 ingress queues</text>
  <text class="small" x="130" y="405">64-bit data + 8-bit ctrl</text>
  <text class="small" x="130" y="431">wr / rdy handshake</text>
  <text class="tiny" x="130" y="462">MAC + CPU queues</text>

  <rect class="outer" x="270" y="115" width="1260" height="800" rx="22"/>
  <text class="subtitle" x="300" y="153">user_data_path</text>

  <rect class="network" x="315" y="315" width="205" height="170" rx="14"/>
  <text class="label" x="418" y="356">input_arbiter</text>
  <text class="small" x="418" y="388">8 inputs → 1 stream</text>
  <text class="small" x="418" y="417">stage number 2</text>
  <text class="tiny" x="418" y="449">packet + register ring</text>

  <rect class="network" x="570" y="315" width="230" height="170" rx="14"/>
  <text class="label" x="685" y="356">output_port_lookup</text>
  <text class="small" x="685" y="388">NF2 header routing</text>
  <text class="small" x="685" y="417">stage number 4</text>
  <text class="tiny" x="685" y="449">packet + register ring</text>

  <rect class="group" x="845" y="180" width="420" height="630" rx="18"/>
  <text class="subtitle" x="1055" y="216" text-anchor="middle">lab8_wrapper</text>

  <rect class="memory" x="905" y="250" width="300" height="130" rx="13"/>
  <text class="label" x="1055" y="288">convertible_fifo</text>
  <text class="small" x="1055" y="318">one packet • 256 × 72 BRAM</text>
  <text class="small" x="1055" y="345">capture / processor access / drain</text>

  <rect class="compute" x="875" y="440" width="160" height="125" rx="13"/>
  <text class="label" x="955" y="475">ARM CPU</text>
  <text class="small" x="955" y="503">4-thread FGMT</text>
  <text class="small" x="955" y="529">5 logical stages</text>

  <rect class="memory" x="1075" y="440" width="160" height="125" rx="13"/>
  <text class="label" x="1155" y="475">DMA</text>
  <text class="small" x="1155" y="503">bidirectional</text>
  <text class="small" x="1155" y="529">64-bit / cycle</text>

  <rect class="compute" x="975" y="615" width="200" height="125" rx="13"/>
  <text class="label" x="1075" y="650">GPU</text>
  <text class="small" x="1075" y="678">6-stage pipeline</text>
  <text class="small" x="1075" y="704">4 × BF16; scalar INT16</text>

  <rect class="control" x="875" y="755" width="360" height="42" rx="10"/>
  <text class="small" x="1055" y="782">registers • mode/reset/status • cycle counter</text>

  <rect class="network" x="1310" y="315" width="175" height="170" rx="14"/>
  <text class="label" x="1398" y="356">output_queues</text>
  <text class="small" x="1398" y="388">8 output queues</text>
  <text class="small" x="1398" y="417">stage number 6</text>
  <text class="tiny" x="1398" y="449">external SRAM owner</text>

  <rect class="control" x="345" y="690" width="245" height="105" rx="14"/>
  <text class="label" x="468" y="727">udp_reg_master</text>
  <text class="small" x="468" y="756">23-bit word address</text>
  <text class="small" x="468" y="779">32-bit data / 2-bit source</text>

  <rect class="control" x="25" y="690" width="230" height="105" rx="14"/>
  <text class="label" x="140" y="729">Host / CPCI</text>
  <text class="small" x="140" y="758">program, control, status</text>

  <rect class="memory" x="1300" y="635" width="195" height="105" rx="14"/>
  <text class="label" x="1398" y="674">External SRAM</text>
  <text class="small" x="1398" y="703">19-bit addr / 72-bit data</text>

  <rect class="network" x="1570" y="330" width="205" height="160" rx="16"/>
  <text class="label" x="1673" y="373">8 egress queues</text>
  <text class="small" x="1673" y="405">64-bit data + 8-bit ctrl</text>
  <text class="small" x="1673" y="431">wr / rdy handshake</text>
  <text class="tiny" x="1673" y="462">MAC + CPU queues</text>

  <path class="data" d="M235 410 H315"/>
  <path class="data" d="M520 400 H570"/>
  <path class="data" d="M800 400 H845 H905"/>
  <path class="data" d="M1205 315 H1310"/>
  <path class="data" d="M1485 400 H1570"/>
  <text class="lineLabel" x="275" y="390">72-bit stream</text>

  <path class="bidir" d="M955 440 V380"/>
  <text class="tiny" x="920" y="414">mode 1</text>
  <path class="bidir" d="M1155 440 V380"/>
  <text class="tiny" x="1190" y="414">mode 2</text>
  <path class="bidir" d="M1155 565 V615"/>
  <text class="tiny" x="1210" y="598">DMEM-B</text>

  <path class="bidir" d="M255 742 H345"/>
  <path class="ctrl" d="M590 742 H720 V520 H418 V485"/>
  <path class="ctrl" d="M720 520 H685 V485"/>
  <path class="ctrl" d="M720 520 H845"/>
  <path class="ctrl" d="M1265 742 H1398 V485"/>
  <path class="ctrl" d="M1310 770 H590"/>
  <text class="lineLabel" x="780" y="546">registered NF2 register ring</text>

  <path class="bidir" d="M1398 485 V635"/>

  <rect x="270" y="945" width="18" height="18" class="network"/><text class="legend" x="298" y="960">NetFPGA packet-path block</text>
  <rect x="535" y="945" width="18" height="18" class="compute"/><text class="legend" x="563" y="960">compute block</text>
  <rect x="760" y="945" width="18" height="18" class="memory"/><text class="legend" x="788" y="960">memory / transfer</text>
  <rect x="1015" y="945" width="18" height="18" class="control"/><text class="legend" x="1043" y="960">control plane</text>
  <line x1="1250" y1="954" x2="1300" y2="954" class="data"/><text class="legend" x="1312" y="960">data</text>
  <line x1="1405" y1="954" x2="1455" y2="954" class="ctrl"/><text class="legend" x="1468" y="960">control/status</text>
</svg>
