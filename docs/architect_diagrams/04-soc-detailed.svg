<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2050" viewBox="0 0 3200 2050" role="img" aria-labelledby="title desc">
  <title id="title">Detailed Full SoC Architecture</title>
  <desc id="desc">Detailed hierarchy from NetFPGA user data path through the Lab 8 wrapper, convertible FIFO, ARM processor, DMA engine, GPU core, register ring, resets, and physical memory-port ownership.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#243447"/></marker>
    <marker id="ctrlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#72509b"/></marker>
    <style>
      .bg{fill:#fff}.outer{fill:#f8fafc;stroke:#334e68;stroke-width:2.5}.group{fill:#fff;stroke:#627d98;stroke-width:2}.pipe{fill:#eef1f4;stroke:#66717d;stroke-width:2}.compute{fill:#e8f5e9;stroke:#367a42;stroke-width:2}.memory{fill:#fff3d6;stroke:#a76b00;stroke-width:2}.control{fill:#f1e9fb;stroke:#72509b;stroke-width:2}.network{fill:#e8f1fb;stroke:#245b8a;stroke-width:2}.warn{fill:#fff0e6;stroke:#b45309;stroke-width:2}.title{font:700 38px 'Segoe UI',sans-serif;fill:#102a43}.subtitle{font:600 25px 'Segoe UI',sans-serif;fill:#243b53}.stage{font:700 20px 'Segoe UI',sans-serif;fill:#102a43;text-anchor:middle}.label{font:600 17px 'Segoe UI',sans-serif;fill:#102a43;text-anchor:middle}.small{font:15px 'Segoe UI',sans-serif;fill:#334e68;text-anchor:middle}.tiny{font:13px 'Segoe UI',sans-serif;fill:#486581;text-anchor:middle}.data{fill:none;stroke:#243447;stroke-width:3;marker-end:url(#arrow)}.bidir{fill:none;stroke:#243447;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.ctrl{fill:none;stroke:#72509b;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#ctrlArrow)}.edgeLabel{font:600 13px 'Segoe UI',sans-serif;fill:#243447;text-anchor:middle}.note{font:15px 'Segoe UI',sans-serif;fill:#5b3412;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="3200" height="2050"/>
  <text class="title" x="1600" y="54" text-anchor="middle">Network Processor — Detailed Full-SoC Architecture</text>
  <text class="small" x="1600" y="88">Current RTL hierarchy, packet path, control plane, microarchitectures, and memory-port ownership</text>

  <rect class="network" x="25" y="285" width="195" height="145" rx="14"/>
  <text class="stage" x="123" y="323">8 × ingress</text>
  <text class="small" x="123" y="353">64 data + 8 ctrl</text>
  <text class="small" x="123" y="379">wr / rdy</text>
  <rect class="network" x="2980" y="285" width="195" height="145" rx="14"/>
  <text class="stage" x="3078" y="323">8 × egress</text>
  <text class="small" x="3078" y="353">64 data + 8 ctrl</text>
  <text class="small" x="3078" y="379">wr / rdy</text>

  <rect class="outer" x="255" y="120" width="2670" height="1720" rx="22"/>
  <text class="subtitle" x="290" y="158">user_data_path — one clk/reset</text>

  <rect class="network" x="300" y="270" width="205" height="160" rx="13"/>
  <text class="stage" x="403" y="308">input_arbiter</text>
  <text class="small" x="403" y="339">8 → 1 packet stream</text>
  <text class="small" x="403" y="365">stage 2</text>
  <text class="tiny" x="403" y="395">also register-ring stage</text>
  <rect class="network" x="545" y="270" width="225" height="160" rx="13"/>
  <text class="stage" x="658" y="308">output_port_lookup</text>
  <text class="small" x="658" y="339">NF2 header routing</text>
  <text class="small" x="658" y="365">stage 4</text>
  <text class="tiny" x="658" y="395">also register-ring stage</text>
  <rect class="network" x="2665" y="270" width="215" height="160" rx="13"/>
  <text class="stage" x="2773" y="308">output_queues</text>
  <text class="small" x="2773" y="339">1 stream → 8 queues</text>
  <text class="small" x="2773" y="365">stage 6</text>
  <text class="tiny" x="2773" y="395">owns external SRAM</text>

  <path class="data" d="M220 357H300"/><path class="data" d="M505 350H545"/><path class="data" d="M770 350H815"/><path class="data" d="M2595 350H2665"/><path class="data" d="M2880 357H2980"/>
  <text class="edgeLabel" x="520" y="335">72-bit NF2 stream</text>

  <rect class="group" x="815" y="190" width="1780" height="1450" rx="20"/>
  <text class="subtitle" x="1705" y="230" text-anchor="middle">lab8_wrapper</text>

  <rect class="control" x="855" y="270" width="610" height="150" rx="13"/>
  <text class="stage" x="1160" y="306">Registered NF2 register stage + wrapper register bank</text>
  <text class="small" x="1160" y="338">23-bit word address: upper 17-bit block + lower 6-bit offset • 32-bit data</text>
  <text class="small" x="1160" y="366">FIFO 0x00–0x0B • CPU 0x0C–0x1A • GPU 0x20–0x2B • DMA 0x2C–0x2F • cycle 0x30</text>
  <text class="tiny" x="1160" y="394">program/data access • mode • resets • status • auto-cleared command strobes</text>

  <rect class="control" x="1500" y="270" width="500" height="150" rx="13"/>
  <text class="stage" x="1750" y="306">Reset and run control</text>
  <text class="small" x="1750" y="338">FIFO = reset OR one-shot CTRL[0] (BRAM retained)</text>
  <text class="small" x="1750" y="364">CPU = reset OR CPU_CTRL[1]; scheduler enable CPU_CTRL[0]</text>
  <text class="small" x="1750" y="390">GPU = reset OR GPU_CTRL[0] (defaults held); DMA = system reset only</text>

  <rect class="control" x="2035" y="270" width="515" height="150" rx="13"/>
  <text class="stage" x="2293" y="306">Mode and status</text>
  <text class="small" x="2293" y="338">mode 0: capture / drain • mode 1: CPU-or-PCI proc • mode 2: DMA-or-PCI proc</text>
  <text class="small" x="2293" y="364">FIFO status: packet length, head, tail, empty/full/ready</text>
  <text class="small" x="2293" y="390">GPU status: dma_active + kernel_done • wrapper cycle counter</text>

  <rect class="group" x="855" y="465" width="560" height="500" rx="17"/>
  <text class="stage" x="1135" y="502">convertible_fifo</text>
  <rect class="network" x="885" y="535" width="170" height="145" rx="11"/>
  <text class="label" x="970" y="568">Ingress / Port A</text>
  <text class="small" x="970" y="598">accept only mode 0</text>
  <text class="small" x="970" y="624">write {ctrl,data}</text>
  <text class="tiny" x="970" y="651">IDLE / RECEIVING</text>
  <rect class="memory" x="1080" y="535" width="300" height="145" rx="11"/>
  <text class="label" x="1230" y="568">fifo_bram</text>
  <text class="small" x="1230" y="598">256 × 72 true dual-port</text>
  <text class="small" x="1230" y="624">synchronous read • no reset/init</text>
  <text class="tiny" x="1230" y="651">one count-delimited packet</text>
  <rect class="control" x="885" y="715" width="230" height="205" rx="11"/>
  <text class="label" x="1000" y="748">6-state packet FSM</text>
  <text class="small" x="1000" y="779">IDLE → RECEIVING</text>
  <text class="small" x="1000" y="805">→ PKT_BUFFERED</text>
  <text class="small" x="1000" y="831">→ WAIT1 → WAIT2</text>
  <text class="small" x="1000" y="857">→ DRAINING → IDLE</text>
  <text class="tiny" x="1000" y="890">length from header[39:32]</text>
  <rect class="control" x="1140" y="715" width="240" height="205" rx="11"/>
  <text class="label" x="1260" y="748">Physical Port B mux</text>
  <text class="small" x="1260" y="779">mode 0 / default</text>
  <text class="small" x="1260" y="803">rd_ptr drain read</text>
  <text class="small" x="1260" y="837">mode 1 or 2</text>
  <text class="small" x="1260" y="861">proc addr/data/we</text>
  <text class="tiny" x="1260" y="891">proc ignored in mode 0</text>
  <path class="data" d="M1055 607H1080"/><path class="data" d="M1230 680V715"/><path class="ctrl" d="M1000 715V680"/>
  <path class="data" d="M815 350H835V607H885"/>
  <path class="data" d="M1380 820H1430V445H2575V350H2595"/>
  <text class="edgeLabel" x="2050" y="438">mode-0 drain stream: 64 data + 8 ctrl</text>

  <rect class="control" x="1460" y="490" width="330" height="180" rx="13"/>
  <text class="stage" x="1625" y="525">FIFO proc source mux</text>
  <text class="small" x="1625" y="558">mode1 + cpu_running → CPU</text>
  <text class="small" x="1625" y="584">mode2 + dma_active → DMA</text>
  <text class="small" x="1625" y="610">otherwise → PCI BRAM registers</text>
  <text class="tiny" x="1625" y="642">feeds 8-bit addr / 72-bit data / we</text>
  <path class="bidir" d="M1415 805H1460V580"/>

  <rect class="group" x="855" y="1010" width="720" height="555" rx="17"/>
  <text class="stage" x="1215" y="1048">ARM processor — quad-thread FGMT</text>
  <rect class="control" x="885" y="1085" width="130" height="125" rx="10"/>
  <text class="label" x="950" y="1118">Scheduler</text>
  <text class="small" x="950" y="1147">tid 0..3</text>
  <text class="small" x="950" y="1173">4 × 11b PC</text>
  <rect class="memory" x="1035" y="1085" width="140" height="125" rx="10"/>
  <text class="label" x="1105" y="1118">IMEM</text>
  <text class="small" x="1105" y="1147">512 × 32</text>
  <text class="small" x="1105" y="1173">dual-port</text>
  <rect class="compute" x="1195" y="1085" width="335" height="125" rx="10"/>
  <text class="label" x="1363" y="1118">IF/ID → ID/RF → ID/EX</text>
  <text class="small" x="1363" y="1147">barrel shifter + alu64 → EX/MEM</text>
  <text class="small" x="1363" y="1173">MEM registers + combinational WB mux</text>
  <rect class="memory" x="885" y="1245" width="205" height="190" rx="10"/>
  <text class="label" x="988" y="1278">data_mem windows</text>
  <text class="small" x="988" y="1308">00–7F local DMEM</text>
  <text class="small" x="988" y="1334">80–EF FIFO 00–6F</text>
  <text class="small" x="988" y="1360">F0–FF wrapper aliases</text>
  <text class="tiny" x="988" y="1396">64-bit loads/stores</text>
  <rect class="control" x="1115" y="1245" width="185" height="190" rx="10"/>
  <text class="label" x="1208" y="1278">Per-thread state</text>
  <text class="small" x="1208" y="1308">4 × CPSR NZCV</text>
  <text class="small" x="1208" y="1334">4 × halted bit</text>
  <text class="small" x="1208" y="1360">branch feedback</text>
  <text class="tiny" x="1208" y="1396">no hazard/forwarding</text>
  <rect class="memory" x="1325" y="1245" width="205" height="190" rx="10"/>
  <text class="label" x="1428" y="1278">logic_analyzer</text>
  <text class="small" x="1428" y="1308">2048 × 64</text>
  <text class="small" x="1428" y="1334">WB / MEM events</text>
  <text class="small" x="1428" y="1360">CPCI read port</text>
  <path class="data" d="M1015 1147H1035"/><path class="data" d="M1175 1147H1195"/><path class="data" d="M1363 1210V1245H988"/><path class="data" d="M988 1245V1218H1363"/>

  <rect class="group" x="1830" y="465" width="720" height="1100" rx="17"/>
  <text class="stage" x="2190" y="502">gpu_top + DMA coupling</text>
  <rect class="memory" x="1865" y="535" width="275" height="150" rx="11"/>
  <text class="label" x="2003" y="568">DMA engine</text>
  <text class="small" x="2003" y="597">IDLE → READ prime → COPY</text>
  <text class="small" x="2003" y="623">FIFO addr8 / GPU addr10 / len8</text>
  <text class="small" x="2003" y="649">64-bit word/cycle after prime</text>
  <rect class="control" x="2170" y="535" width="345" height="150" rx="11"/>
  <text class="label" x="2343" y="568">GPU DMEM Port-B mux</text>
  <text class="small" x="2343" y="597">dma_active → DMA</text>
  <text class="small" x="2343" y="623">otherwise → PCI DMEM registers</text>
  <text class="tiny" x="2343" y="651">not independently mode-gated</text>

  <rect class="memory" x="1865" y="735" width="230" height="135" rx="11"/>
  <text class="label" x="1980" y="768">GPU IMEM</text>
  <text class="small" x="1980" y="797">1024 × 32 dual-port</text>
  <text class="tiny" x="1980" y="826">Port B: PCI program load</text>
  <rect class="compute" x="2120" y="735" width="395" height="270" rx="11"/>
  <text class="label" x="2318" y="768">core_top — six stages</text>
  <text class="small" x="2318" y="798">PC/fetch → decoder + 16×64 RF → ID/EX</text>
  <text class="small" x="2318" y="824">EX1 branch • EX1/EX2/EX3 data pipes</text>
  <text class="small" x="2318" y="850">two control-only pipeline_reg_ex rails</text>
  <text class="small" x="2318" y="876">EX3/WB → load/ALU mux → RF</text>
  <text class="small" x="2318" y="910">hazard stalls front end; no forwarding</text>
  <text class="tiny" x="2318" y="944">sticky HALT gates PC/IMEM/core stores</text>
  <text class="tiny" x="2318" y="969">thread=0 • block=0 • blockdim=1</text>
  <rect class="compute" x="1865" y="1040" width="320" height="225" rx="11"/>
  <text class="label" x="2025" y="1073">execute datapaths</text>
  <text class="small" x="2025" y="1103">BCAST select + SIMD input register</text>
  <text class="small" x="2025" y="1129">4 × bf16_alu</text>
  <text class="small" x="2025" y="1155">4 × bf16_fma_unit</text>
  <text class="small" x="2025" y="1181">1 × scalar int16_alu → replicate</text>
  <text class="tiny" x="2025" y="1216">all paths align at EX3</text>
  <rect class="memory" x="2215" y="1040" width="300" height="225" rx="11"/>
  <text class="label" x="2365" y="1073">GPU DMEM</text>
  <text class="small" x="2365" y="1103">1024 × 64 dual-port</text>
  <text class="small" x="2365" y="1129">Port A: core LD/ST</text>
  <text class="small" x="2365" y="1155">Port B: DMA / PCI mux</text>
  <text class="small" x="2365" y="1181">synchronous read-first</text>
  <text class="tiny" x="2365" y="1216">load data reaches WB</text>
  <rect class="control" x="1865" y="1310" width="650" height="190" rx="11"/>
  <text class="label" x="2190" y="1343">Direction and status</text>
  <text class="small" x="2190" y="1372">dir 0: FIFO payload[63:0] → GPU DMEM; FIFO ctrl stripped</text>
  <text class="small" x="2190" y="1398">dir 1: GPU DMEM → FIFO payload; wrapper synthesizes ctrl=00</text>
  <text class="small" x="2190" y="1424">kernel_done from sticky HALT • cycle counter freezes on first done</text>
  <text class="tiny" x="2190" y="1460">DMA start requires mode 2 and nonzero length; addresses wrap at native widths</text>
  <path class="data" d="M2095 802H2120"/><path class="data" d="M2318 1005V1040H2025"/><path class="bidir" d="M2185 1153H2215"/><path class="bidir" d="M2343 685V1040"/>

  <path class="bidir" d="M1625 670V770H2003V685"/>
  <text class="edgeLabel" x="1815" y="756">DMA FIFO side: 64-bit payload</text>
  <path class="bidir" d="M1625 670V985H988V1245"/>
  <text class="edgeLabel" x="1390" y="972">CPU FIFO window</text>
  <path class="ctrl" d="M1465 350H1625V490"/>
  <path class="ctrl" d="M2000 350H2293V420"/>
  <path class="ctrl" d="M1160 420V1515H988V1435"/>
  <path class="ctrl" d="M1160 420V1540H1980V870"/>
  <path class="ctrl" d="M1160 420V1560H2343V685"/>

  <rect class="control" x="305" y="600" width="425" height="150" rx="13"/>
  <text class="stage" x="518" y="636">udp_reg_master</text>
  <text class="small" x="518" y="667">CPCI-facing request / acknowledge</text>
  <text class="small" x="518" y="693">ring traverses arbiter → lookup → wrapper</text>
  <text class="tiny" x="518" y="721">→ output_queues → back to master</text>
  <rect class="control" x="25" y="620" width="215" height="115" rx="13"/>
  <text class="stage" x="133" y="659">Host / CPCI</text>
  <text class="small" x="133" y="688">program + control</text>
  <text class="small" x="133" y="712">readback + status</text>
  <path class="bidir" d="M240 678H305"/>
  <path class="ctrl" d="M518 600V520H403V430"/><path class="ctrl" d="M505 495H658V430"/><path class="ctrl" d="M770 495H1160V420"/><path class="ctrl" d="M1465 495H2773V430"/><path class="ctrl" d="M2773 430V535H730"/>

  <rect class="memory" x="2670" y="650" width="205" height="125" rx="12"/>
  <text class="label" x="2773" y="686">External SRAM</text>
  <text class="small" x="2773" y="714">19-bit addr</text>
  <text class="small" x="2773" y="739">72-bit data</text>
  <path class="bidir" d="M2773 430V650"/>

  <rect class="warn" x="300" y="1880" width="2600" height="120" rx="16"/>
  <text class="stage" x="1600" y="1915">Ownership and sequencing requirements</text>
  <text class="note" x="1600" y="1948">Capture and drain use mode 0. Keep mode 2 stable for every DMA cycle. Return to mode 0 before pulsing FIFO_DRAIN; otherwise physical FIFO Port B still follows the proc bus.</text>
  <text class="note" x="1600" y="1978">The current drain path has one overwritable prefetched word and is reliable only while out_rdy remains continuously asserted; a mid-packet stall can skip the next word.</text>
</svg>
